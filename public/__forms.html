<!-- Static copy of the site's forms so Netlify can detect them at deploy time. Not linked anywhere. -->
<!DOCTYPE html>
<html>
  <body>
    <form name="demo-request" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="demo-request" />
      <input name="name" />
      <input name="email" />
      <input name="org" />
      <input name="type" />
      <input name="size" />
      <input name="phone" />
      <textarea name="message"></textarea>
      <input name="source" />
      <input name="website" />
    </form>
    <form name="pricing-inquiry" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="pricing-inquiry" />
      <input name="subject" />
      <input name="request-type" />
      <input name="name" />
      <input name="email" />
      <input name="org" />
      <input name="location" />
      <input name="phone" />
      <input name="homes" />
      <input name="configuration" />
      <input name="domain-status" />
      <input name="domain-name" />
      <input name="domain-help" />
      <textarea name="message"></textarea>
      <textarea name="scenario"></textarea>
      <textarea name="scenario-json"></textarea>
      <input name="rate-card" />
      <input name="source" />
      <input name="website" />
    </form>
  </body>
</html>
